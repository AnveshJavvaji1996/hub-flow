name: workflow-1

on: push

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: print a working-directory in the runner
        run: echo pwd

      - name: Show the event that triggered this
        run:  echo "This ran because of a ${{ github.event_name }} event"

      - name: show the current date
        run: date
        
